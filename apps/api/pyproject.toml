[project]
name = "digixsquad-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "mypy>=1.15,<2", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py312"
