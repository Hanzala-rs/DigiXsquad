services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: digixsquad
      POSTGRES_USER: digix
      POSTGRES_PASSWORD: digix
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "digix", "-d", "digixsquad"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: digixsquad-minio:local
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile.minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: digixsquad-minio:local
    pull_policy: never
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        attempts=0
        until mc alias set local http://minio:9000 minioadmin minioadmin && mc ready local; do
          attempts=$$((attempts + 1))
          if [ "$$attempts" -ge 15 ]; then exit 1; fi
          sleep 2
        done
        mc mb --ignore-existing local/digixsquad-private
        mc anonymous set none local/digixsquad-private

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
  minio-data:
